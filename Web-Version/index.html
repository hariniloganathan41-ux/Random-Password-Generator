<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🔐 Random Password Generator</h1>
    <p>Instantly create strong and secure passwords to keep your account safe online.</p>

    <div class="password-box">
      <input type="text" id="password" readonly>
      <button onclick="copyPassword()">Copy</button>
    </div>

    <p id="strength" class="strength weak">Strength: Very Weak</p>

    <div class="controls">
      <label>Password length: <span id="lengthValue">8</span></label>
      <input type="range" id="length" min="4" max="20" value="8" oninput="updateLength()">

      <div class="options">
        <label><input type="checkbox" id="uppercase"> Include Uppercase (A-Z)</label>
        <label><input type="checkbox" id="numbers"> Include Numbers (0-9)</label>
        <label><input type="checkbox" id="symbols"> Include Symbols (!@#$)</label>
      </div>
    </div>

    <button id="generate" onclick="generatePassword()">Generate Password</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
